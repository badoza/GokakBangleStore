<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PTB Mobile Bulk Sender</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #8b1c31; /* PTB Crimson */
            --primary-hover: #5a0e1c;
            --accent: #d4af37;  /* PTB Gold */
            --text-dark: #333;
            --whatsapp: #25D366;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
        }

        .tip {
            font-size: 0.8rem;
            color: #666;
            margin-top: 4px;
            display: block;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(139, 28, 49, 0.2);
        }

        .btn:active {
            background-color: var(--primary-hover);
            transform: translateY(2px);
        }

        /* Dashboard specific styles */
        #dashboard {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .progress-box {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .progress-text {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2e7d32;
        }

        .current-number {
            font-size: 1.1rem;
            margin: 10px 0;
            color: var(--text-dark);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp);
            box-shadow: 0 4px 6px rgba(37, 211, 102, 0.3);
            font-size: 1.2rem;
            padding: 18px;
        }

        .btn-whatsapp:active {
            background-color: #1da851;
        }

        .btn-reset {
            background-color: #9e9e9e;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="setupForm">
        <h2>PTB Mobile Bulk Sender</h2>
        
        <div class="form-group">
            <label>Customer Numbers (comma separated):</label>
            <textarea id="numbers" rows="4" placeholder="919876543210, 918888888888"></textarea>
            <span class="tip">Must include country code (e.g., 91 for India).</span>
        </div>
        
        <div class="form-group">
            <label>Message Text:</label>
            <textarea id="message" rows="4" placeholder="Check out our new wholesale collection!"></textarea>
        </div>

        <div class="form-group">
            <label>Image Link (For Preview Attachment):</label>
            <input type="url" id="imageLink" placeholder="https://yourusername.github.io/repo/b1.png">
            <span class="tip">Paste the full GitHub link to b1.png or b2.jpeg here. WhatsApp will generate the image preview.</span>
        </div>
        
        <button class="btn" onclick="startCampaign()">Generate Mobile Campaign</button>
    </div>

    <!-- The Sending Dashboard -->
    <div class="container" id="dashboard">
        <h2>Sending Campaign</h2>
        
        <div class="progress-box">
            <div class="progress-text">Progress: <span id="progressCount">0</span> / <span id="totalCount">0</span></div>
        </div>

        <div class="current-number">
            Ready to send to: <br>
            <strong><span id="displayNumber">---</span></strong>
        </div>

        <button class="btn btn-whatsapp" id="sendNextBtn" onclick="sendNextMessage()">Tap to Send via WhatsApp</button>
        
        <button class="btn btn-reset" onclick="resetCampaign()">End Campaign & Reset</button>
    </div>

    <script>
        let numbersArray = [];
        let currentIndex = 0;
        let finalMessage = "";

        function startCampaign() {
            const rawNumbers = document.getElementById('numbers').value;
            let text = document.getElementById('message').value;
            const imgUrl = document.getElementById('imageLink').value;

            if (!rawNumbers || !text) {
                alert("Please enter numbers and a message.");
                return;
            }

            // Append the image URL so WhatsApp creates a preview
            if (imgUrl) {
                text = text + "\n\nView Catalog: " + imgUrl;
            }
            
            // Encode the text so it works in a URL
            finalMessage = encodeURIComponent(text);

            // Clean the numbers (split by comma, remove spaces)
            numbersArray = rawNumbers.split(',')
                                     .map(num => num.replace(/\s+/g, ''))
                                     .filter(num => num !== "");

            if (numbersArray.length === 0) {
                alert("No valid numbers found.");
                return;
            }

            // Setup Dashboard
            currentIndex = 0;
            document.getElementById('totalCount').innerText = numbersArray.length;
            updateDashboardUI();

            // Switch Views
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        function updateDashboardUI() {
            document.getElementById('progressCount').innerText = currentIndex;
            
            if (currentIndex < numbersArray.length) {
                document.getElementById('displayNumber').innerText = "+" + numbersArray[currentIndex];
                document.getElementById('sendNextBtn').innerText = "Send Message " + (currentIndex + 1);
            } else {
                document.getElementById('displayNumber').innerText = "Campaign Complete!";
                document.getElementById('sendNextBtn').style.display = 'none';
                document.getElementById('progressCount').innerText = numbersArray.length;
            }
        }

        function sendNextMessage() {
            if (currentIndex < numbersArray.length) {
                const num = numbersArray[currentIndex];
                
                // wa.me URL works perfectly on mobile to deep-link into the WhatsApp app
                const waUrl = `https://wa.me/${num}?text=${finalMessage}`;
                
                // Open WhatsApp
                window.location.href = waUrl;
                
                // Increment for when the user comes back to the browser
                currentIndex++;
                
                // Small delay to update UI while the app is switching
                setTimeout(() => {
                    updateDashboardUI();
                }, 1000);
            }
        }

        function resetCampaign() {
            if(confirm("Are you sure you want to end this campaign?")) {
                document.getElementById('setupForm').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('sendNextBtn').style.display = 'block';
            }
        }
    </script>
</body>
</html>
