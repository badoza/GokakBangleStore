<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PTB Mobile Bulk Sender</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #8b1c31; 
            --primary-hover: #5a0e1c;
            --text-dark: #333;
            --whatsapp: #25D366;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h2 {
            color: var(--primary);
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        textarea, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .tip { font-size: 0.8rem; color: #666; margin-top: 4px; display: block; }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: block;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        /* Dashboard styles */
        #dashboard { display: none; text-align: center; padding: 20px 0; }
        .progress-box { background: #e8f5e9; border: 1px solid #c8e6c9; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .progress-text { font-size: 1.2rem; font-weight: 600; color: #2e7d32; }
        .current-number { font-size: 1.1rem; margin: 10px 0; }
        
        .btn-whatsapp { background-color: var(--whatsapp); padding: 18px; }
        .btn-reset { background-color: #9e9e9e; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Setup Form -->
    <div class="container" id="setupForm">
        <h2>PTB Mobile Sender</h2>
        
        <div class="form-group">
            <label>Customer Numbers (comma separated):</label>
            <textarea id="numbers" rows="4" placeholder="919876543210, 918888888888"></textarea>
            <span class="tip">Must include country code (e.g., 91 for India).</span>
        </div>
        
        <div class="form-group">
            <label>Message Text:</label>
            <textarea id="message" rows="4" placeholder="Check out our new wholesale collection!"></textarea>
        </div>

        <div class="form-group">
            <label>Website Link (For Image Preview):</label>
            <input type="url" id="link" placeholder="https://yourname.github.io/repo/">
        </div>
        
        <button class="btn" onclick="startCampaign()">Generate Mobile Campaign</button>
    </div>

    <!-- Sending Dashboard -->
    <div class="container" id="dashboard">
        <h2>Sending Campaign</h2>
        
        <div class="progress-box">
            <div class="progress-text">Progress: <span id="progressCount">0</span> / <span id="totalCount">0</span></div>
        </div>

        <div class="current-number">
            Ready to send to: <br>
            <strong><span id="displayNumber">---</span></strong>
        </div>

        <!-- Changed from a button to a real anchor link with target="_blank" -->
        <a id="sendNextBtn" class="btn btn-whatsapp" href="#" target="_blank" onclick="handleSendClick()">Tap to Send via WhatsApp</a>
        
        <button class="btn btn-reset" onclick="resetCampaign()">End Campaign & Reset</button>
    </div>

    <script>
        let numbersArray = [];
        let currentIndex = 0;
        let finalMessage = "";

        // Check if there is an active campaign saved in the browser's memory
        window.onload = function() {
            if (localStorage.getItem('ptb_numbers')) {
                numbersArray = JSON.parse(localStorage.getItem('ptb_numbers'));
                currentIndex = parseInt(localStorage.getItem('ptb_index'));
                finalMessage = localStorage.getItem('ptb_message');
                
                if (currentIndex < numbersArray.length) {
                    showDashboard();
                } else {
                    clearMemory(); // Campaign was already finished
                }
            }
        };

        function startCampaign() {
            const rawNumbers = document.getElementById('numbers').value;
            let text = document.getElementById('message').value;
            const linkUrl = document.getElementById('link').value;

            if (!rawNumbers || !text) {
                alert("Please enter numbers and a message.");
                return;
            }

            if (linkUrl) {
                text = text + "\n\nView Catalog: " + linkUrl;
            }
            
            finalMessage = encodeURIComponent(text);
            numbersArray = rawNumbers.split(',').map(num => num.replace(/\s+/g, '')).filter(num => num !== "");

            if (numbersArray.length === 0) {
                alert("No valid numbers found.");
                return;
            }

            currentIndex = 0;
            saveMemory();
            showDashboard();
        }

        function showDashboard() {
            document.getElementById('setupForm').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('totalCount').innerText = numbersArray.length;
            updateDashboardUI();
        }

        function updateDashboardUI() {
            document.getElementById('progressCount').innerText = currentIndex;
            
            if (currentIndex < numbersArray.length) {
                const num = numbersArray[currentIndex];
                document.getElementById('displayNumber').innerText = "+" + num;
                
                // Dynamically update the link's destination
                const waUrl = `https://wa.me/${num}?text=${finalMessage}`;
                const sendBtn = document.getElementById('sendNextBtn');
                sendBtn.href = waUrl;
                sendBtn.innerText = "Send Message " + (currentIndex + 1);
                sendBtn.style.display = 'block';
            } else {
                document.getElementById('displayNumber').innerText = "Campaign Complete!";
                document.getElementById('sendNextBtn').style.display = 'none';
                document.getElementById('progressCount').innerText = numbersArray.length;
                clearMemory();
            }
        }

        function handleSendClick() {
            // Because this is an <a> tag with target="_blank", the browser natively opens a new tab.
            // We just need to increase the counter and save the progress.
            currentIndex++;
            saveMemory();
            
            // Wait a moment before updating the UI so the user can transition to WhatsApp
            setTimeout(() => {
                updateDashboardUI();
            }, 1000);
        }

        // --- Memory Functions ---
        function saveMemory() {
            localStorage.setItem('ptb_numbers', JSON.stringify(numbersArray));
            localStorage.setItem('ptb_index', currentIndex);
            localStorage.setItem('ptb_message', finalMessage);
        }

        function clearMemory() {
            localStorage.removeItem('ptb_numbers');
            localStorage.removeItem('ptb_index');
            localStorage.removeItem('ptb_message');
        }

        function resetCampaign() {
            if(confirm("Are you sure you want to end this campaign?")) {
                clearMemory();
                document.getElementById('setupForm').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
                
                // Clear the form fields
                document.getElementById('numbers').value = "";
                document.getElementById('message').value = "";
            }
        }
    </script>
</body>
</html>
